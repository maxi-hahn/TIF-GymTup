<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo verde menta con bordes redondeados -->
  <rect x="0" y="0" width="100" height="100" rx="28" fill="#5eead4" />
  
  <!-- Grupo de la mancuerna con rotación de -45 grados -->
  <g transform="translate(50, 50) rotate(-45) translate(-50, -50)">
    <!-- Barra central de la mancuerna -->
    <rect x="25" y="45" width="50" height="10" rx="5" fill="none" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Discos del lado izquierdo -->
    <rect x="20" y="30" width="6" height="40" rx="3" fill="#5eead4" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    <rect x="9" y="37" width="6" height="26" rx="3" fill="#5eead4" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Discos del lado derecho -->
    <rect x="74" y="30" width="6" height="40" rx="3" fill="#5eead4" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    <rect x="85" y="37" width="6" height="26" rx="3" fill="#5eead4" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
  </g>
</svg>